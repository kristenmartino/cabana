<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="ttl">Cabana system architecture</title>
  <desc id="dsc">Member portal and ops automation for Sailfish Pool Care: member browser to Next.js on Vercel, Supabase Postgres as source of truth with three edge functions, and external services Claude Haiku, Stripe, n8n, Airtable, Telegram and Resend operational alerts.</desc>
  <style>
    :root{
      --node-fill:#ffffff; --node-stroke:#334155; --label:#1e293b; --sub:#64748b;
      --edge:#64748b; --edge-label:#475569; --group:#94a3b8; --grp-fill:#00000006;
      --halo:#f8fafc; --panel:#f8fafc; --panel-stroke:#e2e8f0;
      --accent:#0e7490; --accent-fill:#ecfeff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --node-fill:#0f172a; --node-stroke:#64748b; --label:#e2e8f0; --sub:#94a3b8;
        --edge:#94a3b8; --edge-label:#cbd5e1; --group:#475569; --grp-fill:#ffffff08;
        --halo:#0b1220; --panel:#0d1526; --panel-stroke:#243043;
        --accent:#5eead4; --accent-fill:#0b2b30;
      }
    }
    :root[data-theme="light"]{
      --node-fill:#ffffff; --node-stroke:#334155; --label:#1e293b; --sub:#64748b;
      --edge:#64748b; --edge-label:#475569; --group:#94a3b8; --grp-fill:#00000006;
      --halo:#f8fafc; --panel:#f8fafc; --panel-stroke:#e2e8f0;
      --accent:#0e7490; --accent-fill:#ecfeff;
    }
    :root[data-theme="dark"]{
      --node-fill:#0f172a; --node-stroke:#64748b; --label:#e2e8f0; --sub:#94a3b8;
      --edge:#94a3b8; --edge-label:#cbd5e1; --group:#475569; --grp-fill:#ffffff08;
      --halo:#0b1220; --panel:#0d1526; --panel-stroke:#243043;
      --accent:#5eead4; --accent-fill:#0b2b30;
    }
    text{ fill:var(--label); }
    .node{ fill:var(--node-fill); stroke:var(--node-stroke); stroke-width:1.2; }
    .fn{ fill:var(--node-fill); stroke:var(--accent); stroke-width:1.1; }
    .db{ fill:var(--accent-fill); stroke:var(--accent); stroke-width:1.4; }
    .title{ fill:var(--label); font-weight:600; }
    .accent-title{ fill:var(--accent); font-weight:600; }
    .sub{ fill:var(--sub); }
    .grp{ fill:var(--grp-fill); stroke:var(--group); stroke-width:1; stroke-dasharray:4 4; }
    .grplbl{ fill:var(--group); letter-spacing:.09em; font-weight:600; }
    .edge{ stroke:var(--edge); stroke-width:1.2; fill:none; }
    .edge-a{ stroke:var(--accent); stroke-width:1.9; fill:none; }
    .elbl{ fill:var(--edge-label); paint-order:stroke; stroke:var(--halo); stroke-width:3.2px; stroke-linejoin:round; }
    .elbl-a{ fill:var(--accent); paint-order:stroke; stroke:var(--halo); stroke-width:3.2px; stroke-linejoin:round; font-weight:600; }
    .ah{ fill:var(--edge); }
    .aha{ fill:var(--accent); }
    .panel{ fill:var(--panel); stroke:var(--panel-stroke); stroke-width:1; }
    .lgttl{ fill:var(--sub); letter-spacing:.1em; font-weight:600; }
    .lgb{ fill:var(--label); font-weight:600; }
    .lgt{ fill:var(--sub); }
    .lg-neutral{ fill:none; stroke:var(--sub); stroke-width:1.1; stroke-dasharray:2.4 2; }
    .lg-cyl{ fill:none; stroke:var(--accent); stroke-width:1.1; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,1 L6.8,4 L0.5,7 Z" class="ah"/>
    </marker>
    <marker id="aha" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,1 L6.8,4 L0.5,7 Z" class="aha"/>
    </marker>
  </defs>

  <!-- ============ GROUP CONTAINERS ============ -->
  <g>
    <rect class="grp" x="22" y="150" width="144" height="86" rx="12"/>
    <text class="grplbl" x="36" y="167" font-size="10">MEMBER</text>

    <rect class="grp" x="172" y="150" width="172" height="96" rx="12"/>
    <text class="grplbl" x="184" y="167" font-size="10">VERCEL</text>

    <rect class="grp" x="350" y="100" width="316" height="314" rx="14"/>
    <text class="grplbl" x="362" y="119" font-size="10">SUPABASE</text>
  </g>

  <!-- ============ EDGES ============ -->
  <g>
    <!-- Member -> Next.js -->
    <path class="edge" d="M152,203 L182,205" marker-end="url(#ah)"/>

    <!-- Next.js -> Claude (server action) and return -->
    <path class="edge" d="M250,176 L250,100" marker-end="url(#ah)"/>
    <path class="edge" d="M274,99 L274,173" marker-end="url(#ah)"/>
    <text class="elbl" x="262" y="137" font-size="10" text-anchor="middle">server action</text>

    <!-- Next.js -> Postgres -->
    <path class="edge" d="M334,208 L360,233" marker-end="url(#ah)"/>

    <!-- Next.js -> Stripe (create session) -->
    <path class="edge" d="M260,238 L260,297" marker-end="url(#ah)"/>
    <text class="elbl" x="268" y="273" font-size="10" text-anchor="start">create session</text>

    <!-- Stripe -> stripe-webhook (signed webhook) -->
    <path class="edge" d="M334,338 L545,381" marker-end="url(#ah)"/>
    <text class="elbl" x="430" y="349" font-size="10" text-anchor="middle">signed webhook</text>

    <!-- stripe-webhook -> Postgres -->
    <path class="edge" d="M588,356 L513,321" marker-end="url(#ah)"/>
    <!-- telegram-webhook -> Postgres -->
    <path class="edge" d="M548,274 L512,274" marker-end="url(#ah)"/>
    <!-- airtable-writeback -> Postgres -->
    <path class="edge" d="M556,190 L513,227" marker-end="url(#ah)"/>

    <!-- Postgres -> n8n : OUTBOX (accent) -->
    <path class="edge-a" d="M435,213 L435,88 L901,88 L901,236" marker-end="url(#aha)"/>
    <text class="elbl-a" x="650" y="80" font-size="10" text-anchor="middle">outbox: trigger + sweep</text>

    <!-- n8n -> Airtable / Telegram / Email -->
    <path class="edge" d="M846,264 L830,180" marker-end="url(#ah)"/>
    <path class="edge" d="M846,280 L830,274" marker-end="url(#ah)"/>
    <path class="edge" d="M846,296 L830,368" marker-end="url(#ah)"/>

    <!-- Airtable -> airtable-writeback (whitelisted automation) -->
    <path class="edge" d="M700,178 L659,170" marker-end="url(#ah)"/>
    <text class="elbl" x="678" y="147" font-size="10" text-anchor="middle">whitelisted automation</text>

    <!-- Telegram -> telegram-webhook (commands / buttons) -->
    <path class="edge" d="M700,274 L659,274" marker-end="url(#ah)"/>
    <text class="elbl" x="672" y="238" font-size="10" text-anchor="middle">commands / buttons</text>
  </g>

  <!-- ============ NODES ============ -->
  <!-- Member -->
  <g>
    <rect class="node" x="36" y="176" width="116" height="52" rx="9"/>
    <text class="title" x="94" y="199" font-size="12.5" text-anchor="middle">Member</text>
    <text class="sub" x="94" y="215" font-size="10" text-anchor="middle">phone / browser</text>
  </g>

  <!-- Claude Haiku -->
  <g>
    <rect class="node" x="186" y="40" width="150" height="56" rx="9"/>
    <text class="title" x="261" y="65" font-size="12.5" text-anchor="middle">Claude Haiku</text>
    <text class="sub" x="261" y="82" font-size="10" text-anchor="middle">intake triage</text>
  </g>

  <!-- Next.js -->
  <g>
    <rect class="node" x="186" y="176" width="148" height="62" rx="9"/>
    <text class="title" x="260" y="196" font-size="12.5" text-anchor="middle">Next.js App Router</text>
    <text class="sub" x="260" y="211" font-size="9.5" text-anchor="middle">portal UI +</text>
    <text class="sub" x="260" y="224" font-size="9.5" text-anchor="middle">server actions</text>
  </g>

  <!-- Stripe -->
  <g>
    <rect class="node" x="186" y="300" width="148" height="52" rx="9"/>
    <text class="title" x="260" y="323" font-size="12.5" text-anchor="middle">Stripe Checkout</text>
    <text class="sub" x="260" y="339" font-size="10" text-anchor="middle">payment session</text>
  </g>

  <!-- Postgres cylinder -->
  <g>
    <path class="db" d="M361,226 L361,320 A74,13 0 0 0 509,320 L509,226 A74,13 0 0 1 361,226 Z"/>
    <ellipse class="db" cx="435" cy="226" rx="74" ry="13"/>
    <text class="accent-title" x="435" y="257" font-size="12.5" text-anchor="middle">Postgres</text>
    <text class="sub" x="435" y="275" font-size="9.5" text-anchor="middle">RLS · source of truth</text>
    <text class="sub" x="435" y="291" font-size="9.5" text-anchor="middle">outbox · audit</text>
  </g>

  <!-- Edge functions -->
  <g>
    <rect class="fn" x="548" y="150" width="108" height="40" rx="8"/>
    <text class="title" x="602" y="174" font-size="11" text-anchor="middle">airtable-writeback</text>

    <rect class="fn" x="548" y="254" width="108" height="40" rx="8"/>
    <text class="title" x="602" y="278" font-size="11" text-anchor="middle">telegram-webhook</text>

    <rect class="fn" x="548" y="356" width="108" height="40" rx="8"/>
    <text class="title" x="602" y="380" font-size="11" text-anchor="middle">stripe-webhook</text>
  </g>

  <!-- n8n -->
  <g>
    <rect class="node" x="846" y="240" width="110" height="80" rx="9"/>
    <text class="title" x="901" y="272" font-size="12.5" text-anchor="middle">n8n</text>
    <text class="sub" x="901" y="288" font-size="9.5" text-anchor="middle">orchestration</text>
    <text class="sub" x="901" y="302" font-size="9.5" text-anchor="middle">retries · DLQ</text>
  </g>

  <!-- Airtable / Telegram / Email -->
  <g>
    <rect class="node" x="700" y="150" width="128" height="56" rx="9"/>
    <text class="title" x="764" y="176" font-size="12.5" text-anchor="middle">Airtable</text>
    <text class="sub" x="764" y="192" font-size="10" text-anchor="middle">owner console</text>

    <rect class="node" x="700" y="246" width="128" height="56" rx="9"/>
    <text class="title" x="764" y="272" font-size="12.5" text-anchor="middle">Telegram</text>
    <text class="sub" x="764" y="288" font-size="10" text-anchor="middle">owner bot</text>

    <rect class="node" x="700" y="340" width="128" height="56" rx="9"/>
    <text class="title" x="764" y="366" font-size="12.5" text-anchor="middle">Resend</text>
    <text class="sub" x="764" y="382" font-size="10" text-anchor="middle">ops alert fallback</text>
  </g>

  <!-- ============ COMPLEXITY-ZONE LEGEND ============ -->
  <g>
    <rect class="panel" x="24" y="430" width="316" height="104" rx="10"/>
    <text class="lgttl" x="40" y="452" font-size="10">COMPLEXITY ZONES</text>

    <!-- payment truth -->
    <rect class="lg-neutral" x="40" y="461" width="14" height="11" rx="2"/>
    <text x="64" y="471" font-size="10"><tspan class="lgb">payment truth</tspan><tspan class="lgt"> — verified webhook → DB, idempotent</tspan></text>

    <!-- delivery tracking -->
    <line class="edge-a" x1="40" y1="488" x2="52" y2="488" marker-end="url(#aha)"/>
    <text x="64" y="492" font-size="10"><tspan class="lgb">delivery tracking</tspan><tspan class="lgt"> — outbox → n8n, retries + DLQ</tspan></text>

    <!-- member isolation -->
    <g class="lg-cyl">
      <ellipse cx="47" cy="505" rx="7" ry="2.4"/>
      <path d="M40,505 L40,512 A7,2.4 0 0 0 54,512 L54,505"/>
    </g>
    <text x="64" y="513" font-size="10"><tspan class="lgb">member isolation</tspan><tspan class="lgt"> — RLS on Postgres, per-account</tspan></text>
  </g>
</svg>
